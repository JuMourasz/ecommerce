
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">ShopEase</a>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="produtos.html">Produtos</a>
                <a href="login.html">Entrar</a>
            </div>
        </nav>
    </header>

    <main class="form-container">
        <form id="formCadastro">
            <h1>Criar uma conta</h1>
            <p>Preencha seus dados para se cadastrar.</p>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha" required>

            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" placeholder="Repita sua senha" required>

            <button type="submit" class="btn">Cadastrar</button>

            <p id="mensagemCadastro"></p>

            <p>Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>
        </form>
    </main>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
